[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lattice"
version = "0.1.0"
description = "Lattice (lattice-mcp): <50ms architecture graph, 1-shot AST code slicer, and formal pre-commit gate for AI coding agents (zero LLMs, zero API keys)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
lattice = "lattice.cli:main"
lattice-mcp = "lattice.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["lattice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
